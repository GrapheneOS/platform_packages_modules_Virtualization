[package]
name = "forwarder_guest_launcher"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.91"
clap = { version = "4.5.20", features = ["derive"] }
env_logger = "0.11.5"
listeners = "0.2.1"
log = "0.4.22"
prost = "0.13.3"
tokio = { version = "1.40.0", features = ["io-util", "process", "rt-multi-thread"] }
tonic = "0.12.3"
vsock = "0.5.1"
linux = { path = "../../libs/liblinux" }

[build-dependencies]
tonic-build = "0.12.3"

[package.metadata.deb]
maintainer = "ferrochrome-dev@google.com"
copyright = "2024, The Android Open Source Project"
depends = "$auto"
maintainer-scripts = "debian/"
systemd-units = { }
